t-[14px] leading-[22px] text-faint lg:block\",\"children\":\"Application Software for Business › Mock ชุดที่ 2 › ผลการสอบ\"}],[\"$\",\"$L26\",null,{\"subject\":\"biz\",\"set\":2,\"questions\":[{\"id\":\"biz-s2-001\",\"topic\":\"AI Graphic ด้วย Nano Banana\",\"difficulty\":1,\"question\":\"วัตถุประสงค์ 3 ข้อของคอร์ส Nano Banana คือข้อใด\",\"choices\":[\"Zero Cost, Mobile-First และ Thai Native\",\"Cost Efficiency, Speed Content และ Commercial Quality\",\"Requirement, Design และ Development\",\"Sorting, Filtering และ Grouping\"],\"answer\":1,\"explanation\":\"สไลด์วัตถุประสงค์: Cost Efficiency (ลดเวลาการผลิตสื่อ) · Speed Content (Speed to Market) · Commercial Quality (ผลลัพธ์คุณภาพสูงใช้งานจริงได้) · Zero Cost/Mobile-First/Thai Native เป็น \\\"The Nano Banana Secret\\\"\",\"source\":\"docs/APP-BUSINESS/AI Graphic with Nano Banana (Gemini) .pdf p.3\"},{\"id\":\"biz-s2-002\",\"topic\":\"AI Graphic ด้วย Nano Banana\",\"difficulty\":1,\"question\":\"หัวข้อการเรียนรู้ 3 ชั่วโมงของคอร์สเรียงตามลำดับใด\",\"choices\":[\"Brand DNA → Marketing Hack → Mobile Studio\",\"Mobile Studio → Brand DNA → Marketing Hack\",\"Marketing Hack → Brand DNA → Mobile Studio\",\"Marketing Hack → Mobile Studio → Brand DNA\"],\"answer\":3,\"explanation\":\"สไลด์: Hour 1 Marketing Hack (ภาพโฆษณาหยุดนิ้ว) · Hour 2 Mobile Studio (ยกระดับภาพถ่ายสินค้า) · Hour 3 Brand DNA (มาสคอตและโลโก้)\",\"source\":\"docs/APP-BUSINESS/AI Graphic with Nano Banana (Gemini) .pdf p.4\"},{\"id\":\"biz-s2-003\",\"topic\":\"AI Graphic ด้วย Nano Banana\",\"difficulty\":1,\"question\":\"เมื่อสั่ง Gemini ให้สร้างภาพในสัดส่วนที่ต้องการ (เช่น 9:16) ควรระบุสัดส่วนไว้ตรงไหนของ prompt\",\"choices\":[\"ต้นคำสั่ง ก่อนชื่อสินค้า\",\"ในวงเล็บหลังคำว่า Subject\",\"ไม่ต้องระบุ เพราะ Gemini เลือกให้เอง\",\"ท้ายคำสั่ง\"],\"answer\":3,\"explanation\":\"สไลด์ \\\"สั่ง Gemini ให้เปลี่ยนสัดส่วน\\\": ระบุขนาดสัดส่วนที่ต้องการลงใน \\\"ท้ายคำสั่ง (Prompt)\\\" เสมอเพื่อให้ AI ประมวลผลได้ถูกต้องแม่นยำ เช่น \\\"... ในสัดส่วน 9:16\\\"\",\"source\":\"docs/APP-BUSINESS/AI Graphic with Nano Banana (Gemini) .pdf p.31\"},{\"id\":\"biz-s2-004\",\"topic\":\"AI Graphic ด้วย Nano Banana\",\"difficulty\":1,\"question\":\"ตามหลักจริยธรรมการใช้ AI สร้างภาพ ใครคือผู้รับผิดชอบต่อผลลัพธ์ทางกฎหมายของภาพที่สร้าง\",\"choices\":[\"ผู้ใช้งาน\",\"Google ผู้พัฒนา Gemini\",\"ตัว AI เอง\",\"แพลตฟอร์มที่นำภาพไปโพสต์\"],\"answer\":0,\"explanation\":\"สไลด์: AI คือผู้ช่วยสร้างสรรค์ที่ทรงพลัง แต่ \\\"ผู้ใช้งาน\\\" คือผู้เดียวที่ต้องรับผิดชอบต่อผลลัพธ์ทางกฎหมาย\",\"source\":\"docs/APP-BUSINESS/AI Graphic with Nano Banana (Gemini) .pdf p.16\"},{\"id\":\"biz-s2-005\",\"topic\":\"AI Graphic ด้วย Nano Banana\",\"difficulty\":2,\"question\":\"Pain Point \\\"งานช้า (Production Bottleneck) รอคิวนาน\\\" ของการทำกราฟิกแบบเดิม จับคู่กับ Solution ใดของการใช้ AI\",\"choices\":[\"Zero Cost: ใช้เครื่องมือฟรี 100%\",\"Mobile-First: ทำบนมือถือ จบงานไว\",\"Business Prompting: สูตรลับระดับโปร\",\"Thai Native: คุยภาษาไทยรู้เรื่อง\"],\"answer\":1,\"explanation\":\"สไลด์จับคู่: ต้นทุนจม (High Cost) ↔ Zero Cost · งานช้า (Production Bottleneck) ↔ Mobile-First · ตันไอเดีย (Creative Block) ↔ Business Prompting\",\"source\":\"docs/APP-BUSINESS/AI Graphic with Nano Banana (Gemini) .pdf p.5\"},{\"id\":\"biz-s2-006\",\"topic\":\"AI Graphic ด้วย Nano Banana\",\"difficulty\":2,\"question\":\"\\\"Mickey Mouse Rule\\\" ในการสร้างภาพด้วย AI หมายถึงอะไร และทางออกคืออะไร\",\"choices\":[\"ห้ามใช้สีแดงและดำในโลโก้ ทางออกคือใช้สีพาสเทล\",\"ห้ามใช้ภาพสัตว์ในโฆษณา ทางออกคือใช้ภาพคน\",\"ห้ามเจนภาพเกินวันละหนึ่งภาพ ทางออกคือสมัครแพลนเสียเงิน\",\"ห้ามให้ AI วาดตัวละครที่มีลิขสิทธิ์มาอยู่ในงานโฆษณา ทางออกคือสร้างมาสคอตของแบรนด์เราเอง\"],\"answer\":3,\"explanation\":\"ข้อควรระวัง 2 (ตัวละครมีลิขสิทธิ์): ห้ามสั่งให้ AI วาดตัวละคร Disney, Marvel, DC, Anime หรือเกมดังมาถือสินค้าหรืออยู่ในโฆษณา · ทางออก: สร้าง \\\"มาสคอต\\\" เฉพาะของแบรนด์เราเอง\",\"source\":\"docs/APP-BUSINESS/AI Graphic with Nano Banana (Gemini) .pdf p.13\"},{\"id\":\"biz-s2-007\",\"topic\":\"AI Graphic ด้วย Nano Banana\",\"difficulty\":2,\"question\":\"คีย์เวิร์ด \\\"Macro shot, Wide angle, 85mm lens, Bokeh\\\" อยู่ในหมวดใดของ Power Words และให้ผลอย่างไร\",\"choices\":[\"หมวดแสง (Lighting): ภาพดูแพง มีมิติ\",\"หมวดกล้อง (Camera): เน้นจุดเด่นสินค้า หน้าชัดหลังละลาย\",\"หมวดพื้นผิว (Texture): วัสดุดูสมจริง\",\"หมวดองค์ประกอบ: ภาพเป็นระเบียบ สบายตา\"],\"answer\":1,\"explanation\":\"ตาราง Power Words: แสง = Cinematic, Golden Hour, Soft Studio Light · กล้อง = Macro shot, Wide angle, 85mm lens, Bokeh · พื้นผิว = Hyper-realistic, Metallic, Matte finish · องค์ประกอบ = Rule of thirds, Symmetrical, Isometric\",\"source\":\"docs/APP-BUSINESS/AI Graphic with Nano Banana (Gemini) .pdf p.27\"},{\"id\":\"biz-s2-008\",\"topic\":\"AI Graphic ด้วย Nano Banana\",\"difficulty\":2,\"question\":\"ข้อใดอธิบายสาเหตุ \\\"การจำซ้อนทับ (Overfitting)\\\" ที่ทำให้ AI สร้างภาพหลอนได้ถูกต้อง\",\"choices\":[\"prompt ยาวเกินไปจน AI อ่านไม่จบ\",\"ในภาพที่ใช้ฝึก นิ้วมือกับแก้วมักอยู่ติดกันเสมอ AI จึงเข้าใจผิดว่านิ้วมือเป็นส่วนหนึ่งของวัตถุ\",\"AI ไม่เข้าใจว่ามนุษย์ต้องมี 5 นิ้ว จึงเดาสุ่ม\",\"prompt สั้นหรือกว้างเกินไป AI จึงต้องจินตนาการเอง\"],\"answer\":1,\"explanation\":\"3 สาเหตุในสไลด์: (1) ขาดความเข้าใจเรื่องฟิสิกส์ — ไม่เข้าใจว่ามนุษย์มี 5 นิ้ว เดาจากข้อมูลที่จำมา (2) Overfitting — ในภาพฝึก นิ้วกับแก้วอยู่ติดกันเสมอ จึงวาดต่อกันจนเบี้ยว (3) คำสั่งคลุมเครือ — prompt สั้นหรือกว้างเกินไป · prompt ยาวไม่ใช่สาเหตุในสไลด์\",\"source\":\"docs/APP-BUSINESS/AI Graphic with Nano Banana (Gemini) .pdf p.44\"},{\"id\":\"biz-s2-009\",\"topic\":\"AI Graphic ด้วย Nano Banana\",\"difficulty\":2,\"question\":\"ตามกฎของเงาที่สมจริง \\\"Contact Shadow\\\" คืออะไร\",\"choices\":[\"เงาใต้ฐานสินค้า ซึ่งต้องเข้มที่สุด\",\"เงาสะท้อนจาง ๆ บนพื้นหินอ่อน\",\"ทิศทางของเงาที่ต้องตรงกับแสง\",\"เงาของโลโก้ที่แปะทับภายหลัง\"],\"answer\":0,\"explanation\":\"สไลด์: Shadow Direction = เงาตกทิศเดียวกับแสง · Contact Shadow = ใต้ฐานสินค้าต้องมีเงาเข้มที่สุด · Reflection = วางบนพื้นหินอ่อนต้องมีเงาสะท้อนจาง ๆ — เงาคือสิ่งที่ยึด (Anchor) สินค้ากับพื้น\",\"source\":\"docs/APP-BUSINESS/AI Graphic with Nano Banana (Gemini) .pdf p.38\"},{\"id\":\"biz-s2-010\",\"topic\":\"AI Graphic ด้วย Nano Banana\",\"difficulty\":3,\"question\":\"ต้องการภาพประกอบสไตล์สีสันจัดจ้านคล้ายงานของศิลปินดังคนหนึ่ง prompt ใดปลอดภัยที่สุดด้านลิขสิทธิ์\",\"choices\":[\"วาดรูปสไตล์เดียวกับ [ชื่อศิลปินดัง] ให้เหมือนที่สุด\",\"วาดรูปสไตล์ Pop Art สีสันจัดจ้าน\",\"คัดลอกภาพของ [ชื่อศิลปินดัง] แล้วเปลี่ยนสี\",\"วาดรูปที่มีลายเซ็นของ [ชื่อศิลปินดัง] กำกับ\"],\"answer\":1,\"explanation\":\"สไลด์ \\\"เทคนิคการสั่งให้ปลอดภัย\\\": ควรเลี่ยง \\\"วาดรูปสไตล์ [ชื่อศิลปินดัง]\\\" (ลอกเลียนผลงานโดยไม่ได้รับอนุญาต) · ควรทำ \\\"วาดรูปสไตล์ [แนวศิลปะ เช่น Pop Art]\\\" — อ้างแนวศิลปะแทนตัวบุคคล\",\"source\":\"docs/APP-BUSINESS/AI Graphic with Nano Banana (Gemini) .pdf p.17\"},{\"id\":\"biz-s2-011\",\"topic\":\"AI Graphic ด้วย Nano Banana\",\"difficulty\":3,\"question\":\"ร้านชื่อ \\\"อุ่นใจ\\\" ต้องการโลโก้ที่มีชื่อร้านภาษาไทย โดยใช้ Gemini ร่วมกับ Canva (AI ยังเขียนฟอนต์ไทยได้ไม่ดี) ลำดับการทำงานใดเหมาะสมที่สุด\",\"choices\":[\"ให้ Gemini เจนไอคอนที่ไม่มี Text → ลบพื้นหลัง → ใส่ชื่อร้านด้วยฟอนต์ไทยใน Canva\",\"ให้ Gemini เจนโลโก้พร้อมคำว่า \\\"อุ่นใจ\\\" → ลบพื้นหลัง → โพสต์ได้เลย\",\"พิมพ์ชื่อร้านใน Canva → ให้ Gemini เปลี่ยนเป็นฟอนต์ไทย → ลบพื้นหลัง\",\"ลบพื้นหลัง → ให้ Gemini เจนไอคอน → ให้ Gemini ใส่ชื่อร้าน\"],\"answer\":0,\"explanation\":\"Workflow: 1. เสกไอคอน (สัญลักษณ์ที่ไม่มี Text) 2. ลบพื้นหลัง (Remove Background) 3. ใส่ฟอนต์ไทยใน Canva — เพราะ AI ยังเจนฟอนต์ไทยโดยตรงไม่ได้ และ Text ในโลโก้มักสะกดผิด\",\"source\":\"docs/APP-BUSINESS/AI Graphic with Nano Banana (Gemini) .pdf p.50–52\"},{\"id\":\"biz-s2-012\",\"topic\":\"AI Graphic ด้วย Nano Banana\",\"difficulty\":3,\"question\":\"มีมาสคอตแมวส้มที่ \\\"นิ่ง\\\" แล้ว (แมวส้ม 3D ใส่เสื้อสีน้ำเงิน มีดาวสีเหลือง พื้นหลังขาว) และต้องการภาพท่าใหม่คือ \\\"ถือกล่องพัสดุ\\\" ควรเขียน prompt อย่างไร\",\"choices\":[\"คงรายละเอียดเดิมทั้งหมด (แมวส้ม 3D เสื้อสีน้ำเงิน ดาวสีเหลือง พื้นหลังขาว) แล้วเปลี่ยนเฉพาะแอคชันเป็นถือกล่องพัสดุ\",\"เขียนสั้น ๆ ว่า \\\"แมวถือกล่อง\\\" เพื่อให้ AI มีอิสระ\",\"เปลี่ยนทั้งสีเสื้อและสไตล์ภาพให้เข้ากับกล่องพัสดุ\",\"ขอให้ AI สุ่มมาสคอตตัวใหม่ที่ถือกล่องพัสดุ\"],\"answer\":0,\"explanation\":\"สไลด์ \\\"วิธีขยายแอคชัน\\\": ทุก prompt ใช้คำบรรยายเดิม (แมวส้ม 3D ใส่เสื้อสีน้ำเงิน มีดาวสีเหลือง ยิ้ม Friendly หันหน้ามองกล้อง พื้นหลังสีขาว) ต่างกันแค่แอคชัน เช่น ถือกล้อง ยกมือทักทาย ถือกล่องพัสดุ กินบะหมี่\",\"source\":\"docs/APP-BUSINESS/AI Graphic with Nano Banana (Gemini) .pdf p.56–57\"},{\"id\":\"biz-s2-013\",\"topic\":\"วิเคราะห์ข้อมูลเบื้องต้นด้วย Excel\",\"difficulty\":1,\"question\":\"TSV ย่อมาจากอะไร\",\"choices\":[\"Text-Sorted Values\",\"Table-Structured Version\",\"Tab-Separated Values\",\"Time-Series Values\"],\"answer\":2,\"explanation\":\"สไลด์: TSV ย่อจาก Tab-Separated Values หมายถึงการแบ่งค่าด้วย Tab ส่วน CSV แบ่งด้วย Comma\",\"source\":\"docs/APP-BUSINESS/FutureSkill_Introduction to Data Analysis in Excel (1).pdf p.47\"},{\"id\":\"biz-s2-014\",\"topic\":\"วิเคราะห์ข้อมูลเบื้องต้นด้วย Excel\",\"difficulty\":1,\"question\":\"SQL ย่อมาจากอะไร\",\"choices\":[\"Simple Question Language\",\"Standard Quality Level\",\"Sequential Query Logic\",\"Structured Query Language\"],\"answer\":3,\"explanation\":\"สไลด์: ภาษา SQL (Structured Query Language) ใช้ Query หรือถามคำถามกับข้อมูลใน RDBMS\",\"source\":\"docs/APP-BUSINESS/FutureSkill_Introduction to Data Analysis in Excel (1).pdf p.33\"},{\"id\":\"biz-s2-015\",\"topic\":\"วิเคราะห์ข้อมูลเบื้องต้นด้วย Excel\",\"difficulty\":1,\"question\":\"ตามตัวเลขของ Gartner ข้อมูลในองค์กรประมาณกี่เปอร์เซ็นต์เป็น Unstructured Data\",\"choices\":[\"20%\",\"50%\",\"80%\",\"95%\"],\"answer\":2,\"explanation\":\"สไลด์: Structured ประมาณ 20% ของ enterprise data · Unstructured ประมาณ 80% (Gartner)\",\"source\":\"docs/APP-BUSINESS/FutureSkill_Introduction to Data Analysis in Excel (1).pdf p.9\"},{\"id\":\"biz-s2-016\",\"topic\":\"วิเคราะห์ข้อมูลเบื้องต้นด้วย Excel\",\"difficulty\":2,\"question\":\"Scatter Plot ต้องใช้กับข้อมูลลักษณะใด และใช้เพื่ออะไร\",\"choices\":[\"ข้อมูลหมวดหมู่กับตัวเลข เพื่อดูสัดส่วน\",\"ข้อมูลตัวเลขทั้ง 2 ตัวแปร เพื่อดูการกระจายตัวและความสัมพันธ์ของข้อมูล\",\"ข้อมูลเวลา เพื่อดูเทรนด์\",\"ข้อมูลหมวดหมู่ทั้ง 2 ตัวแปร เพื่อนับจำนวน\"],\"answer\":1,\"explanation\":\"สไลด์: Scatter Plot ใช้ดูการกระจายตัว/เกาะกลุ่ม ต้องเป็นข้อมูลตัวเลขทั้ง 2 ตัวแปร เช่น รายได้กับยอดซื้อ จำนวนทิปกับยอดรวมค่าอาหาร ทำให้เห็นความสัมพันธ์\",\"source\":\"docs/APP-BUSINESS/FutureSkill_Introduction to Data Analysis in Excel (1).pdf p.57\"},{\"id\":\"biz-s2-017\",\"topic\":\"วิเคราะห์ข้อมูลเบื้องต้นด้วย Excel\",\"difficulty\":2,\"question\":\"Box Plot แสดงผลข้อมูลด้วยค่าใดบ้าง\",\"choices\":[\"Mean, Mode, Median, Range และ Sum\",\"Count, Sum, Average, Max และ Min\",\"Minimum, Quartile 1, Quartile 2 (Median), Quartile 3 และ Maximum\",\"Minimum, Mean, Maximum และ Standard Deviation\"],\"answer\":2,\"explanation\":\"สไลด์: Box Plot แสดงผลด้วย 5 ค่า คือ Minimum, Quartile 1, Quartile 2 (Median), Quartile 3 และ Maximum และค่า Outliers จะแสดงเป็นจุด\",\"source\":\"docs/APP-BUSINESS/FutureSkill_Introduction to Data Analysis in Excel (1).pdf p.62\"},{\"id\":\"biz-s2-018\",\"topic\":\"วิเคราะห์ข้อมูลเบื้องต้นด้วย Excel\",\"difficulty\":2,\"question\":\"งานใดอยู่ในรายการการใช้งานของ Python แต่ไม่อยู่ในรายการของ Excel\",\"choices\":[\"นำเข้า (Import) และส่งออก (Export) ข้อมูล\",\"การแสดงผลข้อมูลด้วยภาพ (Visualize Data)\",\"สร้าง Data Science หรือ Machine Learning Models สำหรับการทำนาย\",\"สรุปข้อมูล\"],\"answer\":2,\"explanation\":\"สไลด์: ทั้ง Excel และ Python ทำ Import/Export, EDA, สรุปข้อมูล และ Visualize ได้ แต่ \\\"สร้าง Data Science หรือ Machine Learning Models สำหรับการทำนาย\\\" อยู่ในรายการของ Python เท่านั้น\",\"source\":\"docs/APP-BUSINESS/FutureSkill_Introduction to Data Analysis in Excel (1).pdf p.31, 35\"},{\"id\":\"biz-s2-019\",\"topic\":\"วิเคราะห์ข้อมูลเบื้องต้นด้วย Excel\",\"difficulty\":2,\"question\":\"เปิดไฟล์ CSV ที่มีเนื้อหาภาษาไทยแล้วตัวอักษรแสดงเป็นสัญลักษณ์ที่อ่านไม่ออก ควรทำอย่างไร\",\"choices\":[\"เปลี่ยนนามสกุลไฟล์เป็น .tsv\",\"เลือกวิธีเข้ารหัส (Encoding) ให้เหมาะสมตอนนำเข้า\",\"ลบหัวคอลัมน์ออกก่อนเปิด\",\"ใช้ Filter กรองแถวที่อ่านไม่ออกทิ้ง\"],\"answer\":1,\"explanation\":\"สไลด์: การเปิดไฟล์ CSV ที่มีเนื้อหาเป็นภาษาไทย ต้องเลือกวิธีเข้ารหัสที่เหมาะสมด้วย เพื่อให้ไฟล์อ่านได้ · ข้อมูลไม่ได้เสีย แค่ตีความ Encoding ผิด\",\"source\":\"docs/APP-BUSINESS/FutureSkill_Introduction to Data Analysis in Excel (1).pdf p.46, 48\"},{\"id\":\"biz-s2-020\",\"topic\":\"วิเคราะห์ข้อมูลเบื้องต้นด้วย Excel\",\"difficulty\":2,\"question\":\"เหตุใดบริษัทจึงสร้าง Customer ID ไว้ใช้อ้างอิงภายใน\",\"choices\":[\"เพื่อให้ไฟล์มีขนาดเล็กลง\",\"เพื่อใช้แทนการขอ Consent จากลูกค้า\",\"เพื่อให้ข้อมูลกลายเป็น Unstructured\",\"เพื่อลดโอกาสที่ข้อมูลส่วนบุคคลจะรั่วไหล ผู้ที่ไม่เกี่ยวข้องจะไม่เห็นข้อมูลส่วนบุคคลของลูกค้า\"],\"answer\":3,\"explanation\":\"สไลด์: เพื่อลดโอกาสที่ข้อมูลส่วนบุคคลจะรั่วไหล จะมีการสร้าง Customer ID สำหรับอ้างอิงในบริษัท · การมี Customer ID ไม่ได้ยกเว้นการขอ Consent\",\"source\":\"docs/APP-BUSINESS/FutureSkill_Introduction to Data Analysis in Excel (1).pdf p.22–23\"},{\"id\":\"biz-s2-021\",\"topic\":\"วิเคราะห์ข้อมูลเบื้องต้นด้วย Excel\",\"difficulty\":3,\"question\":\"ตารางข้อมูลลูกค้ามีคอลัมน์ Age (อายุ) และ Occupation (อาชีพ) ข้อใดจัดประเภทข้อมูล Numerical/Categorical ถูกต้อง\",\"choices\":[\"Age เป็น Categorical Data และ Occupation เป็น Numerical Data\",\"ทั้งสองเป็น Numerical Data\",\"Age เป็น Numerical Data และ Occupation เป็น Categorical Data\",\"ทั้งสองเป็น Categorical Data\"],\"answer\":2,\"explanation\":\"แบบทดสอบ: Age เป็นตัวเลขที่คำนวณได้ → Numerical · Occupation เป็นชื่อหมวดหมู่ → Categorical (เช่นเดียวกับ Branch เป็น Categorical และ Gross income เป็น Numerical)\",\"source\":\"docs/APP-BUSINESS/FutureSkill_Introduction to Data Analysis in Excel (1).pdf p.20, 29\"},{\"id\":\"biz-s2-022\",\"topic\":\"วิเคราะห์ข้อมูลเบื้องต้นด้วย Excel\",\"difficulty\":3,\"question\":\"ตาราง ก มีคอลัมน์ Customer ID, Age, Education, Marital status, Occupation ส่วนตาราง ข มีคอลัมน์ Account No, DATE, TRANSACTION DETAILS, WITHDRAWAL AMT, DEPOSIT AMT ข้อใดจัดชนิดข้อมูลถูกต้อง\",\"choices\":[\"ตาราง ก เป็น Transactional Data และตาราง ข เป็น Demographic Data\",\"ทั้งสองเป็น Demographic Data เพราะเป็นข้อมูลของลูกค้า\",\"ทั้งสองเป็น Unstructured Data\",\"ตาราง ก เป็น Demographic Data และตาราง ข เป็น Transactional Data\"],\"answer\":3,\"explanation\":\"แบบทดสอบในสไลด์: ตารางที่บรรยายลักษณะของบุคคล (อายุ การศึกษา สถานภาพ อาชีพ) = Demographic Data · ตารางที่บันทึกรายการแต่ละครั้ง (วันที่ รายละเอียด ยอดถอน ยอดฝาก) = Transactional Data · ทั้งสองอยู่ในรูปแถวและคอลัมน์จึงเป็น Structured\",\"source\":\"docs/APP-BUSINESS/FutureSkill_Introduction to Data Analysis in Excel (1).pdf p.18–19\"},{\"id\":\"biz-s2-023\",\"topic\":\"วิเคราะห์ข้อมูลเบื้องต้นด้วย Excel\",\"difficulty\":3,\"question\":\"ขั้นตอนการวิเคราะห์ข้อมูลตั้งแต่ต้นจนจบที่คอร์สสรุปไว้เรียงตามข้อใด\",\"choices\":[\"นำเข้าข้อมูล → ทำความเข้าใจข้อมูล → ทำความสะอาดข้อมูล → สรุปด้วย Pivot Table → นำเสนอเป็นกราฟ\",\"นำเสนอเป็นกราฟ → นำเข้าข้อมูล → ทำความสะอาดข้อมูล → สรุปด้วย Pivot Table → ทำความเข้าใจข้อมูล\",\"นำเข้าข้อมูล → สรุปด้วย Pivot Table → ทำความสะอาดข้อมูล → ทำความเข้าใจข้อมูล → นำเสนอเป็นกราฟ\",\"ทำความสะอาดข้อมูล → นำเข้าข้อมูล → นำเสนอเป็นกราฟ → ทำความเข้าใจข้อมูล → สรุปด้วย Pivot Table\"],\"answer\":0,\"explanation\":\"Conclusion: Import Data → Understand Your Data → Clean Data → สรุปผลด้วย Pivot Table → นำเสนอเป็นกราฟ/แผนภาพ · ต้อง Clean ก่อนสรุป มิฉะนั้นผลจะเกิด Bias\",\"source\":\"docs/APP-BUSINESS/FutureSkill_Introduction to Data Analysis in Excel (1).pdf p.75\"},{\"id\":\"biz-s2-024\",\"topic\":\"วิเคราะห์ข้อมูลเบื้องต้นด้วย Excel\",\"difficulty\":3,\"question\":\"ร้านอาหารอยากรู้ว่า \\\"ลูกค้าที่จ่ายค่าอาหารมาก ให้ทิปมากขึ้นด้วยหรือไม่\\\" ควรใช้กราฟใด\",\"choices\":[\"Scatter Plot โดยให้แกนหนึ่งเป็นยอดรวมค่าอาหารและอีกแกนเป็นจำนวนทิป\",\"Pie Chart แสดงสัดส่วนทิปต่อค่าอาหาร\",\"Line Chart โดยให้แกน X เป็นชื่อลูกค้า\",\"Bar Chart แสดงจำนวนลูกค้าแต่ละวัน\"],\"answer\":0,\"explanation\":\"คำถามคือความสัมพันธ์ของตัวเลขสองตัว → Scatter Plot (ตัวอย่างในสไลด์ใช้จำนวนทิปกับยอดรวมค่าอาหาร) · Pie Chart ดูสัดส่วน · Line Chart ต้องมีแกนเวลา\",\"source\":\"docs/APP-BUSINESS/FutureSkill_Introduction to Data Analysis in Excel (1).pdf p.57\"},{\"id\":\"biz-s2-025\",\"topic\":\"Pivot Table และ Pivot Chart\",\"difficulty\":1,\"question\":\"Pivot Table สรุป Gross income รวมของแต่ละสาขาได้ Bangkok 5,265.18 · Chiangmai 5,057.16 · Phuket 5,057.03 (Grand Total 15,379.37) สาขาใดมี Gross income รวมสูงสุด\",\"choices\":[\"Chiangmai (THB 5,057.16)\",\"Phuket (THB 5,057.03)\",\"ทั้งสามสาขาเท่ากัน\",\"Bangkok (THB 5,265.18)\"],\"answer\":3,\"explanation\":\"ตัวเลขในสไลด์: Bangkok 5,265.18 · Chiangmai 5,057.16 · Phuket 5,057.03 · Grand Total 15,379.37 — Bangkok สูงสุด ส่วน Chiangmai กับ Phuket ใกล้กันมากแต่ไม่เท่ากัน\",\"source\":\"docs/APP-BUSINESS/FutureSkill_Create Report on Excel with Pivot Table and Pivot Chart.pdf p.14, 19\"},{\"id\":\"biz-s2-026\",\"topic\":\"Pivot Table และ Pivot Chart\",\"difficulty\":1,\"question\":\"Cogs ในข้อมูล Invoice ย่อมาจากอะไร และหมายถึงอะไร\",\"choices\":[\"Count of goods sold หมายถึงจำนวนที่ขายได้\",\"Cost of gross sales หมายถึงยอดขายรวม\",\"Customer order group size หมายถึงขนาดกลุ่มลูกค้า\",\"Cost of goods sold หมายถึงต้นทุนขาย\"],\"answer\":3,\"explanation\":\"สไลด์: Cogs (Cost of goods sold) ต้นทุนขาย\",\"source\":\"docs/APP-BUSINESS/FutureSkill_Create Report on Excel with Pivot Table and Pivot Chart.pdf p.12\"},{\"id\":\"biz-s2-027\",\"topic\":\"Pivot Table และ Pivot Chart\",\"difficulty\":1,\"question\":\"ข้อใดถูกต้องเกี่ยวกับ Invoice ID ในข้อมูลชุดนี้\",\"choices\":[\"ลูกค้าคนเดียวกันใช้ Invoice ID เดียวกันทุกครั้ง\",\"แต่ละแถวมี Invoice ID ไม่ซ้ำกัน (Unique)\",\"Invoice ID ซ้ำกันได้ภายในสาขาเดียวกัน\",\"Invoice ID คือรหัสของสาขา\"],\"answer\":1,\"explanation\":\"สไลด์: Invoice ID คือเลขที่ใบแจ้งหนี้ ในข้อมูลชุดนี้แต่ละแถว Invoice ID จะไม่ซ้ำกัน หรือ Unique\",\"source\":\"docs/APP-BUSINESS/FutureSkill_Create Report on Excel with Pivot Table and Pivot Chart.pdf p.10\"},{\"id\":\"biz-s2-028\",\"topic\":\"Pivot Table และ Pivot Chart\",\"difficulty\":2,\"question\":\"Chapter 3 ของคอร์ส Pivot Table เรียนเรื่องใด\",\"choices\":[\"การเขียนโค้ด VBA เพื่อสร้าง Pivot Table\",\"การนำเข้าไฟล์ CSV และเลือก Encoding\",\"การ Sorting, Filtering และ Grouping Data โดยกำหนดช่วงปี / เดือน\",\"การสร้าง Slicer และ Timeline\"],\"answer\":2,\"explanation\":\"เช็คลิสต์ Chapter 3: การคำนวณค่า Values และ Fields · การทำ Sorting, Filtering และ Grouping Data โดยกำหนดช่วงปี / เดือน\",\"source\":\"docs/APP-BUSINESS/FutureSkill_Create Report on Excel with Pivot Table and Pivot Chart.pdf p.24–25\"},{\"id\":\"biz-s2-029\",\"topic\":\"Pivot Table และ Pivot Chart\",\"difficulty\":2,\"question\":\"Sorting ต่างจาก Filtering ใน Pivot Table อย่างไร\",\"choices\":[\"Sorting ลบรายการออก ส่วน Filtering เรียงลำดับ\",\"Sorting เปลี่ยนลำดับของรายการ ส่วน Filtering เลือกแสดงเฉพาะบางรายการ\",\"Sorting รวมรายการเป็นกลุ่ม ส่วน Filtering เปลี่ยนวิธีคำนวณ\",\"ทั้งสองเปลี่ยนข้อมูลต้นทาง\"],\"answer\":1,\"explanation\":\"Sorting = เรียงลำดับ (จำนวนรายการเท่าเดิม) · Filtering = แสดงเฉพาะรายการที่เลือก · การรวมรายการเป็นกลุ่มคือ Grouping · ทั้งหมดไม่แก้ข้อมูลต้นทาง\",\"source\":\"docs/APP-BUSINESS/FutureSkill_Create Report on Excel with Pivot Table and Pivot Chart.pdf p.24–26\"},{\"id\":\"biz-s2-030\",\"topic\":\"Pivot Table และ Pivot Chart\",\"difficulty\":2,\"question\":\"ข้อใดเป็นตัวอย่างข้อมูลที่เหมาะกับ Pie Chart และใช้เพื่อดูอะไร\",\"choices\":[\"ราคาหุ้นรายวัน เพื่อดูเทรนด์\",\"จำนวนทิปกับยอดค่าอาหาร เพื่อดูความสัมพันธ์\",\"% ยอดขายสินค้าระหว่าง Online และ Store เพื่อดูสัดส่วน\",\"ค่าทิปวันพฤหัสกับวันศุกร์ เพื่อดู Outliers\"],\"answer\":2,\"explanation\":\"สไลด์: Pie Chart เช่นเดียวกับกราฟแท่งแต่แสดงเป็นวงกลม ใช้ข้อมูลหมวดหมู่กับตัวเลข เช่น % ยอดขายระหว่าง Online และ Store · Mini-workshop: Pie Chart เพื่อให้เห็นสัดส่วน\",\"source\":\"docs/APP-BUSINESS/FutureSkill_Create Report on Excel with Pivot Table and Pivot Chart.pdf p.39, 43\"},{\"id\":\"biz-s2-031\",\"topic\":\"Pivot Table และ Pivot Chart\",\"difficulty\":2,\"question\":\"ใน Full Workshop ของคอร์ส ใช้ Pivot Charts เพื่อแสดงอะไร\",\"choices\":[\"รายชื่อลูกค้าทุกคน\",\"Trends ของสินค้าในหมวดหมู่ที่มีการเติบโต\",\"สูตรที่ใช้คำนวณ Total\",\"ขั้นตอนการติดตั้ง Add-on\"],\"answer\":1,\"explanation\":\"เช็คลิสต์ Workshop: ใช้ Pivot Table แสดงยอดขายแต่ละเดือนแบ่งตามสาขาและหมวดหมู่สินค้า · ใช้ Pivot Charts แสดง Trends สินค้าในหมวดหมู่ที่มีการเติบโต\",\"source\":\"docs/APP-BUSINESS/FutureSkill_Create Report on Excel with Pivot Table and Pivot Chart.pdf p.46\"},{\"id\":\"biz-s2-032\",\"topic\":\"Pivot Table และ Pivot Chart\",\"difficulty\":2,\"question\":\"ข้อสรุปของคอร์สกล่าวถึงสาเหตุของปัญหา Data Visualization ว่าอย่างไร\",\"choices\":[\"เกิดจาก Excel รุ่นเก่าเกินไป\",\"ส่วนหนึ่งเกิดจากการนำเสนอด้วยแผนภาพผิดประเภทหรือเลือกใช้ไม่เหมาะสม\",\"เกิดจากข้อมูลมีจำนวนแถวมากเกิน 1,000 แถว\",\"เกิดจากการใช้ Pivot Table แทนสูตร\"],\"answer\":1,\"explanation\":\"Conclusion: ปัญหาที่มักเจอในการทำ Data Visualization ส่วนหนึ่งเกิดจากการนำเสนอด้วยแผนภาพผิดประเภทหรือเลือกใช้ไม่เหมาะสม\",\"source\":\"docs/APP-BUSINESS/FutureSkill_Create Report on Excel with Pivot Table and Pivot Chart.pdf p.48\"},{\"id\":\"biz-s2-033\",\"topic\":\"Pivot Table และ Pivot Chart\",\"difficulty\":3,\"question\":\"ตารางไขว้ Gross income (สาขา × เดือน) มีค่า Bangkok เดือน Jan = 1,925, ยอดรวมของ Bangkok = 5,265, ยอดรวมของเดือน Jan = 5,538 และ Grand Total = 15,379 เมื่อแสดงแบบ % of Grand Total ช่อง Bangkok เดือน Jan มีค่าประมาณเท่าใด\",\"choices\":[\"12.52%\",\"36.56%\",\"34.76%\",\"34.24%\"],\"answer\":0,\"explanation\":\"% of Grand Total หารด้วยยอดรวมทั้งตาราง: 1,925 ÷ 15,379 × 100 = 12.52% (ตรงกับสไลด์) · 36.56% คือหารด้วยยอดรวมของ Bangkok (1,925 ÷ 5,265) · 34.76% คือหารด้วยยอดรวมของเดือน Jan (1,925 ÷ 5,538) · 34.24% คือสัดส่วนของ Bangkok ทั้งสาขา\",\"source\":\"docs/APP-BUSINESS/FutureSkill_Create Report on Excel with Pivot Table and Pivot Chart.pdf p.21–22\"},{\"id\":\"biz-s2-034\",\"topic\":\"Pivot Table และ Pivot Chart\",\"difficulty\":3,\"question\":\"ข้อมูล 6 แถวมีคอลัมน์ Payment เป็น Cash, E-wallet, Cash, Credit card, Cash, E-wallet ถ้าวาง Payment ที่ Rows และที่ Values ด้วย (สรุปแบบ Count) ผลของแถว Cash และ Grand Total คือเท่าใด\",\"choices\":[\"Cash = 1 และ Grand Total = 3\",\"Cash = 3 และ Grand Total = 3\",\"Cash = 3 และ Grand Total = 6\",\"Cash = 6 และ Grand Total = 6\"],\"answer\":2,\"explanation\":\"Count นับจำนวนแถวในแต่ละกลุ่ม: Cash ปรากฏ 3 ครั้ง, E-wallet 2, Credit card 1 → Grand Total = 3 + 2 + 1 = 6 (จำนวนแถวทั้งหมด) · 3 คือจำนวนกลุ่ม ไม่ใช่ Grand Total\",\"source\":\"docs/APP-BUSINESS/FutureSkill_Create Report on Excel with Pivot Table and Pivot Chart.pdf p.28\"},{\"id\":\"biz-s2-035\",\"topic\":\"Pivot Table และ Pivot Chart\",\"difficulty\":3,\"question\":\"หลังใช้ Filter เลือกเฉพาะลูกค้า Member พบ Gross income กรุงเทพ 38, เชียงใหม่ 17, ภูเก็ต 45 ถ้าแสดงแบบ % of Grand Total และเรียงจากมากไปน้อย แถวแรกคือข้อใด\",\"choices\":[\"ภูเก็ต 45.0%\",\"กรุงเทพ 38.0%\",\"ภูเก็ต 33.1%\",\"เชียงใหม่ 17.0%\"],\"answer\":0,\"explanation\":\"หลัง Filter แล้ว Grand Total = 38 + 17 + 45 = 100 → ภูเก็ต 45 ÷ 100 = 45.0% มากที่สุดจึงอยู่แถวแรก · 33.1% เกิดจากหารด้วยยอดก่อนกรอง (45 ÷ 136) ซึ่งผิด เพราะ Grand Total คิดจากข้อมูลที่เหลือหลังกรอง\",\"source\":\"docs/APP-BUSINESS/FutureSkill_Create Report on Excel with Pivot Table and Pivot Chart.pdf p.20, 25, 28\"},{\"id\":\"biz-s2-036\",\"topic\":\"ChatGPT ใน Google Sheet\",\"difficulty\":1,\"question\":\"หลังติดตั้ง Add-on \\\"GPT for Docs™ Sheets™ Slides™\\\" แล้ว จะเปิดใช้ ChatGPT ใน Google Sheet ต้องไปที่เมนูใด\",\"choices\":[\"ไฟล์ → นำเข้า → ChatGPT\",\"ส่วนขยาย → GPT for Docs™ Sheets™ Slides™ → Start\",\"แทรก → แผนภูมิ → GPT\",\"ข้อมูล → ตารางสรุปข้อมูล → Start\"],\"answer\":1,\"explanation\":\"ภาพ \\\"การเรียกใช้ ChatGPT ใน Google Sheet\\\": เมนู ส่วนขยาย → GPT for Docs™ Sheets™ Slides™ → Start (ในเมนูเดียวกันมี Enable GPT functions) · การติดตั้งทำที่ ส่วนขยาย → ส่วนเสริม → รับส่วนเสริม\",\"source\":\"docs/APP-BUSINESS/[01WAI1] EP.1 วิธีใช้งาน ChatGPT ช่วยวิเคราะห์ข้อมูลใน Google Sheet สำหรับงานขายและงานการตลาด (1).pdf p.8–9\"},{\"id\":\"biz-s2-037\",\"topic\":\"ChatGPT ใน Google Sheet\",\"difficulty\":1,\"question\":\"การติดตั้ง ChatGPT ใน Google Sheet ตามสรุปของคอร์สทำผ่านเส้นทางเมนูใด\",\"choices\":[\"File → Import → ChatGPT\",\"Insert → PivotTable → GPT\",\"Extension → Add-on → Download → GPT for Docs\",\"Data → From Text/CSV → GPT for Docs\"],\"answer\":2,\"explanation\":\"สรุปเนื้อหา: การติดตั้ง Extension \u003e Add-on \u003e Download \u003e GPT for Docs และการใช้งาน Extension \u003e GPT for Docs\",\"source\":\"docs/APP-BUSINESS/[01WAI1] EP.1 วิธีใช้งาน ChatGPT ช่วยวิเคราะห์ข้อมูลใน Google Sheet สำหรับงานขายและงานการตลาด (1).pdf p.28\"},{\"id\":\"biz-s2-038\",\"topic\":\"ChatGPT ใน Google Sheet\",\"difficulty\":2,\"question\":\"ข้อใดเป็นตัวอย่างงานที่ ChatGPT (ผ่าน Add-on) ทำได้ใน Google Sheet\",\"choices\":[\"ตัดต่อวิดีโอโฆษณา\",\"ดึงข้อมูลอัตราแลกเปลี่ยนจากเว็บไซต์เข้า Google Sheet\",\"ออกแบบโลโก้ของแบรนด์\",\"บันทึกเสียงการประชุม\"],\"answer\":1,\"explanation\":\"สไลด์ยกตัวอย่าง 3 งาน: สรุปผลรวม (Aggregate Data) ของข้อมูลซื้อขาย · ดึงข้อมูลอัตราแลกเปลี่ยนจากเว็บไซต์เข้า Google Sheet · สร้าง Sale Pipeline อัตโนมัติ\",\"source\":\"docs/APP-BUSINESS/[01WAI1] EP.1 วิธีใช้งาน ChatGPT ช่วยวิเคราะห์ข้อมูลใน Google Sheet สำหรับงานขายและงานการตลาด (1).pdf p.5\"},{\"id\":\"biz-s2-039\",\"topic\":\"ChatGPT ใน Google Sheet\",\"difficulty\":2,\"question\":\"เครื่องหมายคำพูด \\\" \\\" ใน prompt สำหรับงาน Google Sheet ใช้ทำอะไร\",\"choices\":[\"สร้างตัวแปรที่เปลี่ยนแปลงได้\",\"แยกตัวเลขกับข้อความ\",\"บอกจำนวนแถวที่ต้องการ\",\"เป็นคำพูดหรือเน้นข้อความ เช่น \\\"pivot table\\\"\"],\"answer\":3,\"explanation\":\"สัญลักษณ์พิเศษ: \\\"\\\" = คำพูด / เน้นข้อความ · - = แยกตัวเลขกับข้อความ (100-rows) · [] = ตัวแปรที่เปลี่ยนแปลงได้ ([SET])\",\"source\":\"docs/APP-BUSINESS/[01WAI1] EP.1 วิธีใช้งาน ChatGPT ช่วยวิเคราะห์ข้อมูลใน Google Sheet สำหรับงานขายและงานการตลาด (1).pdf p.13\"},{\"id\":\"biz-s2-040\",\"topic\":\"ChatGPT ใน Google Sheet\",\"difficulty\":2,\"question\":\"ส่วน Detail ใน prompt มีข้อควรระวังอย่างไร\",\"choices\":[\"ถ้าลงลึกเกินไปจะทำให้คำตอบแคบตาม\",\"ต้องเขียนเป็นภาษาไทยเท่านั้น\",\"ต้องมีเสมอ ขาดไม่ได้\",\"ต้องอยู่หน้า Action\"],\"answer\":0,\"explanation\":\"สไลด์: Detail คือรายละเอียดเพิ่มเติมเพื่อให้คำถามลงลึก (แต่ถ้าลึกเกินไปจะทำให้คำตอบแคบตาม) และ Detail เป็น Optional\",\"source\":\"docs/APP-BUSINESS/[01WAI1] EP.1 วิธีใช้งาน ChatGPT ช่วยวิเคราะห์ข้อมูลใน Google Sheet สำหรับงานขายและงานการตลาด (1).pdf p.12\"},{\"id\":\"biz-s2-041\",\"topic\":\"ChatGPT ใน Google Sheet\",\"difficulty\":2,\"question\":\"ใน Workshop 1 (สร้างใบเสนอราคา) เมื่อได้คำตอบจาก ChatGPT แล้ว นำผลลัพธ์ไปใช้ได้ทางใด\",\"choices\":[\"Copy to Clipboard หรือ Insert to Sheet\",\"Export เป็น PDF เท่านั้น\",\"Paste ลงใน Apps Script แล้วเรียกใช้\",\"ส่งเข้า Gmail โดยอัตโนมัติ\"],\"answer\":0,\"explanation\":\"สรุปขั้นตอน Workshop 1: ส่วนขยาย → GPT for Slides Sheets Docs → Analyze Range Data → ครอบเลือกข้อมูล → ใส่ prompt เช่น Generate Quotation Template by Product → เลือก Copy to Clipboard หรือ Insert to Sheet\",\"source\":\"docs/APP-BUSINESS/[01WAI1] EP.1 วิธีใช้งาน ChatGPT ช่วยวิเคราะห์ข้อมูลใน Google Sheet สำหรับงานขายและงานการตลาด (1).pdf p.17\"},{\"id\":\"biz-s2-042\",\"topic\":\"ChatGPT ใน Google Sheet\",\"difficulty\":3,\"question\":\"prompt \\\"get insight from data by regression model\\\" เมื่อแยกตามรูปแบบ [Action] + [Object] + [Detail] ส่วนใดคือ Detail\",\"choices\":[\"get\",\"insight from data\",\"ไม่มี Detail\",\"by regression model\"],\"answer\":3,\"explanation\":\"Action = get (คำกริยา) · Obj. = insight (from data) · Detail = by regression model ซึ่งเป็นรายละเอียดที่ทำให้คำถามลงลึก (สไลด์ยก Regression model, Outlier เป็นตัวอย่างของ Detail)\",\"source\":\"docs/APP-BUSINESS/[01WAI1] EP.1 วิธีใช้งาน ChatGPT ช่วยวิเคราะห์ข้อมูลใน Google Sheet สำหรับงานขายและงานการตลาด (1).pdf p.12\"},{\"id\":\"biz-s2-043\",\"topic\":\"ChatGPT ใน Google Sheet\",\"difficulty\":3,\"question\":\"สคริปต์ sendEmails() ที่ ChatGPT เขียนให้ใน Workshop 2 มีบรรทัด (ก) `SpreadsheetApp.getActiveSpreadsheet()` (ข) `range.getValues()` (ค) `GmailApp.sendEmail(email, …)` บรรทัดใดเป็นตัวส่งอีเมลจริง และอีกสองบรรทัดทำอะไร\",\"choices\":[\"(ค) ส่งอีเมลผ่าน Gmail ส่วน (ก) อ้างถึงไฟล์ Sheet ที่เปิดอยู่ และ (ข) อ่านค่าจากช่วงเซลล์\",\"(ก) ส่งอีเมล ส่วน (ข) สร้าง Pivot Table และ (ค) อ่านค่าจากเซลล์\",\"(ข) ส่งอีเมล ส่วน (ก) ลบ Sheet และ (ค) เปิด Gmail ในแท็บใหม่\",\"ทั้งสามบรรทัดส่งอีเมลคนละฉบับ\"],\"answer\":0,\"explanation\":\"สคริปต์ในสไลด์: SpreadsheetApp.getActiveSpreadsheet() ได้ไฟล์ที่เปิดอยู่ → getRange(...).getValues() อ่านค่าเป็นตาราง → values.forEach วนทีละแถว → GmailApp.sendEmail ส่งอีเมล ซึ่งตรงกับ prompt ที่สั่งว่า send email by \\\"Gmail\\\" to \\\"Customer\\\"\",\"source\":\"docs/APP-BUSINESS/[01WAI1] EP.1 วิธีใช้งาน ChatGPT ช่วยวิเคราะห์ข้อมูลใน Google Sheet สำหรับงานขายและงานการตลาด (1).pdf p.19–20\"},{\"id\":\"biz-s2-044\",\"topic\":\"Notion\",\"difficulty\":1,\"question\":\"Page ใน Notion คืออะไร\",\"choices\":[\"ไฟล์ PDF ที่แก้ไขไม่ได้\",\"แคนวาสที่เพิ่ม blocks ได้หลากหลายและจัดเรียงได้\",\"คอลัมน์หนึ่งของ Database\",\"เมนูตั้งค่าของบัญชี\"],\"answer\":1,\"explanation\":\"สไลด์: Page คือแคนวาสที่เราสามารถเพิ่ม blocks รวม blocks ได้หลากหลายและจัดเรียงได้ ทุก Page ประกอบด้วย Blocks หลายอัน\",\"source\":\"docs/APP-BUSINESS/[01NT1] Slide FutureSkill_Notion EP1.pdf p.23\"},{\"id\":\"biz-s2-045\",\"topic\":\"Notion\",\"difficulty\":1,\"question\":\"พิมพ์ --- แล้วกด enter ใน Notion จะได้ block ชนิดใด\",\"choices\":[\"Toggle list\",\"Quote\",\"Divider (เส้นแบ่ง)\",\"Heading 3\"],\"answer\":2,\"explanation\":\"ทางลัด: --- + enter = Divider · \u003e + space = Toggle list · \\\" + space = Quote · /h3 + enter = Heading 3\",\"source\":\"docs/APP-BUSINESS/[01NT1] Slide FutureSkill_Notion EP1.pdf p.50\"},{\"id\":\"biz-s2-046\",\"topic\":\"Notion\",\"difficulty\":1,\"question\":\"เมนู \\\"Language \u0026 region\\\" ใน Settings ของ Notion ใช้ตั้งค่าอะไร\",\"choices\":[\"ชื่อและไอคอนของ Workspace\",\"ภาษา และวันเริ่มต้นสัปดาห์ในปฏิทิน\",\"อีเมลและรหัสผ่าน\",\"การแจ้งเตือนทางโทรศัพท์\"],\"answer\":1,\"explanation\":\"สไลด์: Language \u0026 region = ตั้งค่าภาษา และวันเริ่มต้นสัปดาห์ในปฏิทิน (Start week on Monday) · ชื่อและไอคอนของ Workspace อยู่ที่ Settings · อีเมลและรหัสผ่านอยู่ที่ My account · การแจ้งเตือนอยู่ที่ My notification \u0026 settings\",\"source\":\"docs/APP-BUSINESS/[01NT1] Slide FutureSkill_Notion EP1.pdf p.38–41\"},{\"id\":\"biz-s2-047\",\"topic\":\"Notion\",\"difficulty\":1,\"question\":\"ขั้นแรกของการสร้าง Account Notion คืออะไร\",\"choices\":[\"เข้าเว็บ notion.so/signup กรอกอีเมล แล้วกด Continue with email\",\"ดาวน์โหลด Zapier และสร้างบัญชี\",\"ซื้อแพลน Plus ก่อนจึงจะสมัครได้\",\"สร้าง Database อย่างน้อยหนึ่งอัน\"],\"answer\":0,\"explanation\":\"ขั้นตอน: 1. กรอกอีเมลที่ notion.so/signup → 2. ใส่ sign up code ชั่วคราวหรือคลิก magic link → 3. ใส่ชื่อและรหัสผ่าน → 4. เลือกจุดประสงค์การใช้ · แพลน Free ใช้ได้โดยไม่ต้องจ่าย\",\"source\":\"docs/APP-BUSINESS/[01NT1] Slide FutureSkill_Notion EP1.pdf p.16–20\"},{\"id\":\"biz-s2-048\",\"topic\":\"Notion\",\"difficulty\":2,\"question\":\"ข้อใดไม่ใช่วิธีสร้าง Page ใน Notion\",\"choices\":[\"กด Create a new page ใต้ปุ่ม Settings \u0026 members\",\"กด Add a page (+) ข้าง Private section\",\"พิมพ์ /page แล้วกด enter\",\"พิมพ์ --- แล้วกด enter\"],\"answer\":3,\"explanation\":\"สไลด์ให้ 3 วิธี: Create a new page · Add a page + · พิมพ์ /page แล้วกด enter — ส่วน --- + enter สร้าง Divider ไม่ใช่ Page\",\"source\":\"docs/APP-BUSINESS/[01NT1] Slide FutureSkill_Notion EP1.pdf p.24, 50\"},{\"id\":\"biz-s2-049\",\"topic\":\"Notion\",\"difficulty\":2,\"question\":\"Toggle list ใน Notion คืออะไร\",\"choices\":[\"ช่องทำเครื่องหมายว่าทำเสร็จแล้ว\",\"เส้นแบ่งระหว่างหัวข้อ\",\"ปุ่มที่ซ่อนหรือเปิดเนื้อหาได้\",\"กล่องข้อความคำแนะนำ\"],\"answer\":2,\"explanation\":\"Basic Blocks: Toggle List = ปุ่มที่สามารถซ่อนหรือเปิดเนื้อหา · To-do list = ช่องทำเครื่องหมาย · Divider = เส้นแบ่ง · Callout = ข้อความในกล่องคำแนะนำ\",\"source\":\"docs/APP-BUSINESS/[01NT1] Slide FutureSkill_Notion EP1.pdf p.48\"},{\"id\":\"biz-s2-050\",\"topic\":\"Notion\",\"difficulty\":2,\"question\":\"ใน Calendar view ของ Notion ตัวเลือก \\\"Show calendar as\\\" ในเมนู Layout ใช้ทำอะไร\",\"choices\":[\"เลือกว่าจะใช้ property วันที่ตัวใดวางบนปฏิทิน\",\"เลือกว่าจะเปิดรายการด้านข้างหรือกลางจอ\",\"เลือกว่าจะแสดงปฏิทินเป็นรายเดือน (Month) หรือรายสัปดาห์ (Week)\",\"เลือกสีของแต่ละวัน\"],\"answer\":2,\"explanation\":\"ภาพ Calendar view ในสไลด์: Show calendar as = Month หรือ Week · Show calendar by = เลือก property วันที่ (Date) · Open pages in = Side peek / Center peek\",\"source\":\"docs/APP-BUSINESS/[01NT1] Slide FutureSkill_Notion EP1.pdf p.78–79\"},{\"id\":\"biz-s2-051\",\"topic\":\"Notion\",\"difficulty\":2,\"question\":\"Export หน้า Notion ได้ในรูปแบบใดบ้าง\",\"choices\":[\"PDF, HTML และ Markdown \u0026 CSV\",\"DOCX, XLSX และ PPTX\",\"PDF, PNG และ MP4\",\"HTML, JSON และ XML\"],\"answer\":0,\"explanation\":\"เมนู Export ในสไลด์แสดง Export format: PDF, HTML, Markdown \u0026 CSV\",\"source\":\"docs/APP-BUSINESS/[01NT1] Slide FutureSkill_Notion EP1.pdf p.84\"},{\"id\":\"biz-s2-052\",\"topic\":\"Notion\",\"difficulty\":2,\"question\":\"ปุ่ม Resolve ในความคิดเห็น (Comment) ของ Notion ใช้ทำอะไร\",\"choices\":[\"ตอบกลับความคิดเห็น\",\"เพิ่ม Reaction ให้ความคิดเห็น\",\"แนบไฟล์ในความคิดเห็น\",\"ปิดความคิดเห็นเมื่อจัดการเรื่องนั้นแล้ว\"],\"answer\":3,\"explanation\":\"สไลด์ View all comments: Reply = ตอบกลับและแนบไฟล์ได้ · เพิ่ม Reaction ได้ · คลิก Resolve เมื่อต้องการปิดความคิดเห็น\",\"source\":\"docs/APP-BUSINESS/[01NT1] Slide FutureSkill_Notion EP1.pdf p.85\"},{\"id\":\"biz-s2-053\",\"topic\":\"Notion\",\"difficulty\":3,\"question\":\"Notion แต่ละแพลนเชิญ Guest ได้ไม่เท่ากัน บริษัทต้องการเชิญ Guest ภายนอกเข้ามาดูหน้าจำนวน 150 คน แพลนต่ำสุดที่รองรับคือแพลนใด\",\"choices\":[\"Business (เชิญได้ 250 guests)\",\"Free (เชิญได้ 10 guests)\",\"Plus (เชิญได้ 100 guests)\",\"ไม่มีแพลนใดรองรับ\"],\"answer\":0,\"explanation\":\"ตาราง Price \u0026 Plan: Free = Invite 10 guests · Plus = 100 guests · Business = 250 guests → 150 คนเกิน Plus (100) แต่ไม่เกิน Business (250)\",\"source\":\"docs/APP-BUSINESS/[01NT1] Slide FutureSkill_Notion EP1.pdf p.13\"},{\"id\":\"biz-s2-054\",\"topic\":\"Notion\",\"difficulty\":3,\"question\":\"หน้า Dashboard ต้องการแสดงทั้งรายการงานจาก Database \\\"Task\\\" และเป้าหมายจาก Database \\\"Goals\\\" ในหน้าเดียว โดยไม่สร้างข้อมูลซ้ำ ควรใช้อะไร\",\"choices\":[\"Duplicate ทั้งสอง Database มาไว้ในหน้า\",\"Export เป็น PDF แล้วแนบในหน้า\",\"Linked view of Database\",\"Web Bookmark ไปยังแต่ละ Database\"],\"answer\":2,\"explanation\":\"สไลด์: Linked view of Databases = เชื่อมโยงการแสดงผลของหลาย Database มารวมไว้ในที่เดียวกัน (ใช้สร้างหน้า Bullet Journal ใน Workshop) · Duplicate สร้างข้อมูลชุดใหม่ที่ไม่อัปเดตตามต้นฉบับ\",\"source\":\"docs/APP-BUSINESS/[01NT1] Slide FutureSkill_Notion EP1.pdf p.119–120\"},{\"id\":\"biz-s2-055\",\"topic\":\"Notion\",\"difficulty\":3,\"question\":\"ต้องการให้ \\\"ทุกครั้งที่มีแถวใหม่ในแอปภายนอก ระบบสร้างรายการใหม่ใน Database ของ Notion ให้เอง\\\" ควรใช้เครื่องมือใด และตั้งค่าอย่างไร\",\"choices\":[\"Notion Web Clipper โดยบันทึกหน้าเว็บทีละหน้า\",\"Lock page เพื่อกันการแก้ไข\",\"Page history เพื่อคืนค่าเวอร์ชันเก่า\",\"Zapier โดยกำหนดว่าเมื่อเกิดการกระทำใดขึ้น (Trigger) จะสร้างการกระทำใดต่อ\"],\"answer\":3,\"explanation\":\"สไลด์ Zapier: สร้างบัญชี → เลือกแอปที่ต้องการเชื่อมกับ Notion → กำหนดว่าเมื่อเกิดการกระทำใดขึ้นจะสร้างการกระทำใดต่อ → Try it เพื่อเชื่อมบัญชี ตั้งค่า Trigger และฐานข้อมูล · Web Clipper ต้องกดเองทีละหน้า\",\"source\":\"docs/APP-BUSINESS/[01NT1] Slide FutureSkill_Notion EP1.pdf p.94–97\"},{\"id\":\"biz-s2-056\",\"topic\":\"ระบบบัญชีอัตโนมัติด้วย Excel\",\"difficulty\":1,\"question\":\"แนวคิดการพัฒนาโปรแกรมในคอร์สมี 4 ขั้นเรียงตามข้อใด\",\"choices\":[\"Requirement → Design → Development → Test\",\"Design → Requirement → Test → Development\",\"Development → Test → Design → Requirement\",\"Test → Requirement → Design → Development\"],\"answer\":0,\"explanation\":\"สไลด์ \\\"การพัฒนาโปรแกรม\\\": Requirement (โปรแกรมบัญชีโดยบันทึกจากสมุดรายวัน) → Design (ออกแบบขั้นตอนการทำงาน) → Development (เลือกใช้เครื่องมือ) → Test (ทดสอบ)\",\"source\":\"docs/APP-BUSINESS/FutureSkill_Excel for Accounting_Chapter 2.1.pptx.pdf p.4\"},{\"id\":\"biz-s2-057\",\"topic\":\"ระบบบัญชีอัตโนมัติด้วย Excel\",\"difficulty\":2,\"question\":\"ก่อนเพิ่มปุ่มและเขียน VBA ต้องตั้งค่าใดใน Excel ก่อน\",\"choices\":[\"เปิด Data → Remove Duplicates\",\"เปิด Excel Options → Customize Ribbon แล้วติ๊กแท็บ Developer\",\"เปิด Insert → PivotTable แล้วเลือก New Worksheet\",\"เปิด File → Export → Create PDF\"],\"answer\":1,\"explanation\":\"สไลด์ User Interface แสดงหน้าต่าง Excel Options หัวข้อ Customize Ribbon โดยติ๊กถูกที่ Developer: แท็บ Developer ไม่แสดงโดยค่าเริ่มต้น ต้องเปิดก่อนจึงจะแทรกปุ่มและเข้าหน้าต่างเขียน VBA ได้\",\"source\":\"docs/APP-BUSINESS/FutureSkill_Excel for Accounting_Chapter 2.2.pptx.pdf p.4, 6\"},{\"id\":\"biz-s2-058\",\"topic\":\"ระบบบัญชีอัตโนมัติด้วย Excel\",\"difficulty\":2,\"question\":\"ตัวแปร VBA แบบ Integer ต่างจาก Double อย่างไร\",\"choices\":[\"Integer เก็บข้อความ ส่วน Double เก็บวันที่\",\"Integer เก็บทศนิยม ส่วน Double เก็บจำนวนเต็ม\",\"Integer เก็บจำนวนเต็ม ส่วน Double เก็บตัวเลขที่มีทศนิยมได้\",\"ทั้งสองเก็บได้เฉพาะค่า True/False\"],\"answer\":2,\"explanation\":\"สไลด์ VBA เบื้องต้นกล่าวถึง Variable (Integer, Double): Integer ใช้กับจำนวนเต็ม เช่น ตัวนับรอบของ For loop ส่วน Double ใช้กับตัวเลขทศนิยม เช่น จำนวนเงินที่มีสตางค์\",\"source\":\"docs/APP-BUSINESS/FutureSkill_Excel for Accounting_Chapter 2.3.pptx.pdf p.2\"},{\"id\":\"biz-s2-059\",\"topic\":\"ระบบบัญชีอัตโนมัติด้วย Excel\",\"difficulty\":2,\"question\":\"ข้อใดเป็นรายงานทางบัญชีที่ยกเป็นตัวอย่างว่าใช้ VBA ใน Excel สร้างได้\",\"choices\":[\"รายงานงบทดลอง แบบฟอร์มหัก ณ ที่จ่าย ภ.ง.ด.1ก และสลิปเงินเดือน\",\"ภาพโฆษณาสินค้า โลโก้ และมาสคอต\",\"ใบสมัคร Notion และ Template Gallery\",\"ไฟล์ CSV, TSV และ Encoding\"],\"answer\":0,\"explanation\":\"สไลด์ \\\"ใช้ VBA ในการสร้างรายงาน\\\": ตัวอย่างการสร้างรายงานงบทดลอง · สร้างแบบฟอร์มหัก ณ ที่จ่าย แบบ ภ.ง.ด.1ก · สลิปเงินเดือน\",\"source\":\"docs/APP-BUSINESS/FutureSkill_Excel for Accounting_Chapter 2.3.pptx.pdf p.4\"},{\"id\":\"biz-s2-060\",\"topic\":\"ระบบบัญชีอัตโนมัติด้วย Excel\",\"difficulty\":3,\"question\":\"บันทึกรายการ: Dr เงินสด 3,000, Dr ลูกหนี้การค้า 7,000, Cr รายได้ขาย 10,000 แล้วกด Post ข้อใดถูกต้อง\",\"choices\":[\"ไม่ผ่าน เพราะมี Dr สองบรรทัดแต่ Cr บรรทัดเดียว\",\"ผ่าน และงบทดลองมียอดรวม Dr 10,000 กับ Cr 20,000\",\"ไม่ผ่าน เพราะ 3,000 ไม่เท่ากับ 10,000\",\"ผ่านการตรวจเพราะ Dr รวม 10,000 เท่ากับ Cr รวม 10,000 และงบทดลองมียอดรวม Dr และ Cr ฝั่งละ 10,000\"],\"answer\":3,\"explanation\":\"ปุ่ม Post ตรวจ \\\"ยอดรวม\\\" Dr กับ Cr: 3,000 + 7,000 = 10,000 = Cr 10,000 → ดุล จำนวนบรรทัดไม่จำเป็นต้องเท่ากัน · จากนั้นสรุปไปแยกประเภทและงบทดลอง: เงินสด Dr 3,000 + ลูกหนี้ Dr 7,000 = 10,000 และรายได้ขาย Cr 10,000\",\"source\":\"docs/APP-BUSINESS/FutureSkill_Excel for Accounting_Chapter 2.3.pptx.pdf p.3\"},{\"id\":\"biz-s2-061\",\"topic\":\"สูตรลัด Excel (เสริม)\",\"difficulty\":1,\"question\":\"ฟังก์ชันใดใช้หาผลรวมของช่วงเซลล์\",\"choices\":[\"COUNT\",\"AVERAGE\",\"SUM\",\"TRIM\"],\"answer\":2,\"explanation\":\"(เนื้อหาเสริม) SUM = ผลรวม · COUNT = นับเซลล์ตัวเลข · AVERAGE = ค่าเฉลี่ย · TRIM = ตัดช่องว่างเกินในข้อความ\",\"source\":\"เนื้อหาเสริม: สูตรลัด Excel ที่ใช้บ่อยในงานจริง (ไม่มีเอกสารใน docs/APP-BUSINESS)\"},{\"id\":\"biz-s2-062\",\"topic\":\"สูตรลัด Excel (เสริม)\",\"difficulty\":2,\"question\":\"ถ้า C2 มีค่า 45 สูตร `=IF(C2\u003e=50, \\\"ผ่าน\\\", \\\"ไม่ผ่าน\\\")` ได้ผลอะไร\",\"choices\":[\"ไม่ผ่าน\",\"ผ่าน\",\"45\",\"FALSE\"],\"answer\":0,\"explanation\":\"(เนื้อหาเสริม) IF(เงื่อนไข, ค่าเมื่อจริง, ค่าเมื่อเท็จ): 45 \u003e= 50 เป็นเท็จ จึงคืนค่าตัวที่สาม \\\"ไม่ผ่าน\\\" · IF คืนค่าที่กำหนด ไม่ได้คืน FALSE หรือค่าของเซลล์\",\"source\":\"เนื้อหาเสริม: สูตรลัด Excel ที่ใช้บ่อยในงานจริง (ไม่มีเอกสารใน docs/APP-BUSINESS)\"},{\"id\":\"biz-s2-063\",\"topic\":\"สูตรลัด Excel (เสริม)\",\"difficulty\":2,\"question\":\"argument ตัวสุดท้ายที่เป็น FALSE ใน `=VLOOKUP(\\\"P007\\\", A2:C100, 3, FALSE)` หมายความว่าอย่างไร\",\"choices\":[\"ให้ค้นหาแบบตรงทุกตัว (exact match)\",\"ให้ค้นหาจากขวาไปซ้าย\",\"ไม่ต้องแสดงผลเมื่อเกิด error\",\"ให้คืนค่าจากคอลัมน์แรก\"],\"answer\":0,\"explanation\":\"(เนื้อหาเสริม) FALSE (หรือ 0) = exact match ถ้าไม่ใส่ VLOOKUP จะค้นแบบใกล้เคียงและอาจได้ค่าผิดโดยไม่มี error · เลข 3 คือคอลัมน์ที่คืนค่า · VLOOKUP หาได้เฉพาะจากคอลัมน์ซ้ายสุดไปทางขวา\",\"source\":\"เนื้อหาเสริม: สูตรลัด Excel ที่ใช้บ่อยในงานจริง (ไม่มีเอกสารใน docs/APP-BUSINESS)\"},{\"id\":\"biz-s2-064\",\"topic\":\"สูตรลัด Excel (เสริม)\",\"difficulty\":2,\"question\":\"`=IFERROR(VLOOKUP(A2, D:F, 3, FALSE), \\\"ไม่พบรหัส\\\")` ทำงานอย่างไร\",\"choices\":[\"แสดง \\\"ไม่พบรหัส\\\" เสมอ ไม่ว่าจะพบหรือไม่\",\"ลบแถวที่ค้นไม่พบออกจากตาราง\",\"ถ้า VLOOKUP เกิด error เช่น #N/A จะแสดงข้อความ \\\"ไม่พบรหัส\\\" แทน\",\"ค้นหาซ้ำจนกว่าจะพบ\"],\"answer\":2,\"explanation\":\"(เนื้อหาเสริม) IFERROR(สูตร, ค่าเมื่อเกิด error): ถ้าสูตรทำงานปกติจะคืนผลของสูตร ถ้าเกิด error จึงคืนค่าทดแทน · #N/A คือ error ของการค้นหาไม่พบ\",\"source\":\"เนื้อหาเสริม: สูตรลัด Excel ที่ใช้บ่อยในงานจริง (ไม่มีเอกสารใน docs/APP-BUSINESS)\"},{\"id\":\"biz-s2-065\",\"topic\":\"สูตรลัด Excel (เสริม)\",\"difficulty\":3,\"question\":\"คอลัมน์ B (แถว 2–5) มีค่า A, B, A, A และคอลัมน์ E มีค่า 10, 20, 30, 50 สูตร `=AVERAGEIF(B2:B5, \\\"A\\\", E2:E5)` ได้ผลเท่าใด\",\"choices\":[\"27.5\",\"90\",\"30\",\"3\"],\"answer\":2,\"explanation\":\"(เนื้อหาเสริม) AVERAGEIF เฉลี่ยค่าใน E เฉพาะแถวที่ B เป็น \\\"A\\\": แถว 2, 4, 5 → (10 + 30 + 50) ÷ 3 = 30 · 27.5 คือค่าเฉลี่ยของทุกแถว (110 ÷ 4) · 90 คือ SUMIF · 3 คือ COUNTIF\",\"source\":\"เนื้อหาเสริม: สูตรลัด Excel ที่ใช้บ่อยในงานจริง (ไม่มีเอกสารใน docs/APP-BUSINESS)\"},{\"id\":\"biz-s2-066\",\"topic\":\"สูตรลัด Excel (เสริม)\",\"difficulty\":3,\"question\":\"A1 ถึง A3 มีคะแนน 40, 60 และ 80 สูตร `=IF(AVERAGE(A1:A3)\u003e=60, \\\"ผ่าน\\\", \\\"ไม่ผ่าน\\\")` ได้ผลอะไร\",\"choices\":[\"ไม่ผ่าน เพราะมีคะแนน 40 ที่ต่ำกว่า 60\",\"ไม่ผ่าน เพราะค่าเฉลี่ยต้องมากกว่า 60\",\"60\",\"ผ่าน เพราะค่าเฉลี่ยเท่ากับ 60 ซึ่งตรงเงื่อนไข \u003e= 60\"],\"answer\":3,\"explanation\":\"(เนื้อหาเสริม) AVERAGE = (40 + 60 + 80) ÷ 3 = 60 → 60 \u003e= 60 เป็นจริง (\u003e= รวมกรณีเท่ากับ) → \\\"ผ่าน\\\" · สูตรดูค่าเฉลี่ย ไม่ได้ดูคะแนนรายตัว\",\"source\":\"เนื้อหาเสริม: สูตรลัด Excel ที่ใช้บ่อยในงานจริง (ไม่มีเอกสารใน docs/APP-BUSINESS)\"},{\"id\":\"biz-s2-067\",\"topic\":\"Excel Dashboard (เสริม)\",\"difficulty\":1,\"question\":\"Timeline ใน Excel ใช้กรองข้อมูลจาก field ชนิดใด\",\"choices\":[\"field ข้อความ\",\"field วันที่\",\"field ตัวเลขทุกชนิด\",\"field ที่มีสูตร\"],\"answer\":1,\"explanation\":\"(เนื้อหาเสริม) Timeline เป็นแถบเลื่อนกรองช่วงเวลา (ปี ไตรมาส เดือน วัน) ใช้ได้กับ field วันที่เท่านั้น ส่วน field หมวดหมู่ใช้ Slicer\",\"source\":\"เนื้อหาเสริม: สร้าง Dashboard เบื้องต้นใน Excel (ไม่มีเอกสารใน docs/APP-BUSINESS)\"},{\"id\":\"biz-s2-068\",\"topic\":\"Excel Dashboard (เสริม)\",\"difficulty\":2,\"question\":\"โครงสร้างไฟล์ Dashboard ที่แนะนำแบ่งเป็น 3 sheet ตามข้อใด\",\"choices\":[\"Dashboard → Data → Chart โดยพิมพ์ตัวเลขลงกราฟเอง\",\"Input → Output → Backup\",\"Journal → Ledger → Trial Balance\",\"Data (ข้อมูลดิบ) → Pivot (ตารางสรุป) → Dashboard (หน้าที่ผู้ใช้ดู)\"],\"answer\":3,\"explanation\":\"(เนื้อหาเสริม) แยก 3 ชั้น: Data เป็น Table ที่เพิ่มข้อมูลที่เดียว · Pivot เป็นตารางสรุปแต่ละมุม · Dashboard รวม KPI card, Pivot Chart และ Slicer · Journal → Ledger → Trial Balance เป็น flow ของระบบบัญชี\",\"source\":\"เนื้อหาเสริม: สร้าง Dashboard เบื้องต้นใน Excel (ไม่มีเอกสารใน docs/APP-BUSINESS)\"},{\"id\":\"biz-s2-069\",\"topic\":\"Excel Dashboard (เสริม)\",\"difficulty\":2,\"question\":\"เพิ่มข้อมูลใหม่ลงในตารางต้นทางแล้ว แต่ตัวเลขใน Dashboard ไม่เปลี่ยน ควรทำอะไร\",\"choices\":[\"ลบ Slicer แล้วสร้างใหม่\",\"สั่ง Refresh All เพราะ Pivot Table ไม่อัปเดตเองเมื่อข้อมูลต้นทางเปลี่ยน\",\"บันทึกไฟล์เป็น CSV แล้วเปิดใหม่\",\"เปลี่ยนชนิดกราฟเป็น Pie Chart\"],\"answer\":1,\"explanation\":\"(เนื้อหาเสริม) Pivot Table เก็บสำเนาข้อมูลไว้ ต้อง Data → Refresh All จึงอ่านข้อมูลใหม่ แล้ว Pivot Chart และ KPI card ที่ผูกอยู่จะเปลี่ยนตาม\",\"source\":\"เนื้อหาเสริม: สร้าง Dashboard เบื้องต้นใน Excel (ไม่มีเอกสารใน docs/APP-BUSINESS)\"},{\"id\":\"biz-s2-070\",\"topic\":\"Excel Dashboard (เสริม)\",\"difficulty\":3,\"question\":\"ผู้บริหารต้องการ Dashboard ที่ (1) เห็นยอดขายรวมทันที (2) เห็นเทรนด์ยอดขายรายเดือน (3) เปรียบเทียบยอดขายของ 3 สาขา ควรเลือกองค์ประกอบใด\",\"choices\":[\"Pie Chart ทั้งสามข้อ เพื่อให้หน้าตาเหมือนกัน\",\"ตารางข้อมูลดิบ, Scatter Plot และ Box Plot\",\"Line Chart สำหรับเปรียบเทียบสาขา และ Pie Chart สำหรับเทรนด์รายเดือน\",\"KPI card ไว้ซ้ายบน, Line Chart สำหรับรายเดือน และ Bar Chart สำหรับเปรียบเทียบสาขา\"],\"answer\":3,\"explanation\":\"(เนื้อหาเสริม ใช้หลักเลือกกราฟจากสไลด์) ตัวเลขสำคัญเดี่ยว ๆ → KPI card วางซ้ายบนที่สายตาเริ่มอ่าน · เทรนด์ตามเวลา → Line Chart · เปรียบเทียบหมวดหมู่ → Bar Chart · Pie Chart ไม่แสดงเทรนด์\",\"source\":\"เนื้อหาเสริม: สร้าง Dashboard เบื้องต้นใน Excel (ไม่มีเอกสารใน docs/APP-BUSINESS); docs/APP-BUSINESS/FutureSkill_Introduction to Data Analysis in Excel (1).pdf p.58–60\"}]}]]}]]\n"])</script><script>self.__next_f.push([1,"27:I[27201,[\"$2\"],\"IconMark\"]\n22:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#faf9f6\"}],[\"$\",\"meta\",\"3\",{\"name\":\"color-scheme\",\"content\":\"light\"}]]\n1f:null\n"])</script><script>self.__next_f.push([1,"25:[[\"$\",\"title\",\"0\",{\"children\":\"ผลสอบชุดที่ 2 · BIZ · CE Exam Prep\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"เตรียมสอบ CE ปี 2: บทเรียนพร้อม simulation แบบ interactive และข้อสอบจำลอง 5 วิชา — OS, OODS, IST, Web App Dev, App Software for Business\"}],[\"$\",\"meta\",\"2
